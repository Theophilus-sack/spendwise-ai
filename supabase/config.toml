[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.ai-advisor]
verify_jwt = true

[functions.categorize-expense]
verify_jwt = true

[functions.ocr-receipt]
verify_jwt = true

[functions.detect-anomaly]
verify_jwt = true

[functions.compute-fds]
verify_jwt = true

[functions.parse-nlp-expense]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.check-budget-alert]
verify_jwt = true

[functions.weekly-reflection]
verify_jwt = true

# Cron-only functions: gated by a shared x-cron-secret header instead of a
# user JWT, since no real user session should ever be able to call these.
[functions.weekly-digest]
verify_jwt = false

[functions.debt-reminders]
verify_jwt = false
